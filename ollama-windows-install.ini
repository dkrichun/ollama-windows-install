; ==============================================================================
; КОНФИГУРАЦИЯ OLLAMA ДЛЯ WINDOWS
; ==============================================================================
; Читается скриптами ollama-windows-install.ps1 и ollama-windows-uninstall.ps1.
; Все параметры опциональны — при отсутствии используются значения по умолчанию.

[paths]
; Каталог для установки бинарников Ollama. Рекомендуется хранить скрипты в
; подпапке install внутри OllamaDir (например, D:\AI\Ollama\install).
OllamaDir=D:\AI\Ollama

; Каталог для скачанных моделей (OLLAMA_MODELS). Должен быть внутри OllamaDir,
; чтобы не терялся при обновлении. Сохраняется в любом случае.
ModelsDir=D:\AI\Ollama\Models

; Каталог для распаковки утилиты NSSM.
NssmDir=C:\Program Files\NSSM

; Каталог для логов службы (stdout и stderr). Пусто = <OllamaDir>\logs.
LogsDir=

; Каталог для скачанных дистрибутивов (архивов Ollama и NSSM).
; Рекомендуется оставлять внутри OllamaDir — тогда NSSM-архив сохраняется
; при обновлении. Пусто = <OllamaDir>\Downloads.
DownloadsDir=D:\AI\Ollama\Downloads

; Каталог для резервных копий при обновлении.
; Пусто = <OllamaDir>\Backup.
BackupDir=D:\AI\Ollama\Backup

[ollama]
; Домашний каталог профиля Ollama (.ollama с ключом id_ed25519).
; Пусто = OllamaDir. Сохраняется при обновлении.
OllamaHome=

[service]
; Имя службы Windows.
ServiceName=Ollama

; Тип запуска: SERVICE_DELAYED_AUTO_START (рекомендуется), SERVICE_AUTO_START, SERVICE_DEMAND_START.
StartType=SERVICE_DELAYED_AUTO_START

; Максимальное время ожидания запуска службы (в секундах).
StartTimeoutSeconds=60

; Задержка перед перезапуском после падения (мс).
AppRestartDelay=10000

; Добавить каталог OllamaDir в PATH.
AddToPath=true

; Добавить каталоги NSSM (win32 и win64) в PATH.
AddNssmToPath=true

; Ротация логов: файлы в LogsDir старше указанного количества дней удаляются.
; 0 = отключить очистку логов.
LogRetentionDays=7

[network]
; Адрес API: 0.0.0.0 (сеть) или 127.0.0.1 (локально).
Host=0.0.0.0

; TCP-порт.
Port=11434

; Создавать правило брандмауэра.
FirewallEnabled=true

; Подсеть для правила (CIDR). Пусто = правило не создается.
FirewallSubnet=192.168.117.0/24

; CORS (через запятую). Пример: http://localhost:3000
Origins=

[downloads]
; Версия Ollama: ask (меню), latest (последняя), или конкретная (например, 0.40.10).
; При использовании параметра -Upgrade это значение игнорируется (берется latest).
OllamaVersion=ask

; Резервный URL для скачивания, если GitHub API недоступен.
OllamaUrl=https://github.com/ollama/ollama/releases/download/v0.40.10/ollama-windows-amd64.zip

; URL для NSSM.
NssmUrl=https://github.com/dkxce/NSSM/releases/download/v2.25/NSSM_v2.25.zip

; Удалять ли архивы после распаковки:
;   true  — оставлять в папке Downloads (архивы NSSM сохраняются),
;   false — удалять после распаковки (экономит место).
KeepDownloads=true

[models]
; Скачивать ли модели после установки.
DownloadModels=true

; Показывать интерактивное меню выбора моделей.
Interactive=true

; Модели для скачивания через запятую (для неинтерактивного режима).
Models=llama3.1:8b,qwen2.5-coder:7b

[performance]
; Время хранения модели в памяти (10m, 24h, -1).
KeepAlive=10m

; Включить Flash Attention (1).
FlashAttention=1

; Тип KV-кэша: f16, q8_0, q4_0.
KvCacheType=q8_0

; Количество параллельных слотов.
NumParallel=1

; Максимум моделей в памяти.
MaxLoadedModels=1

; Отладочные логи (1/0).
Debug=0